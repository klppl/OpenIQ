{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenIQ</title>
<style>
:root{
  --bg:#0b0e13; --panel:#151a22; --panel2:#1c232e; --line:#273040;
  --txt:#e6ebf2; --dim:#8a97a8; --accent:#2fb1ff; --accent2:#16324a;
  --ok:#37d39b; --gold:#ffb020;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;
  padding:12px 22px;background:rgba(11,14,19,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
header.top .brand{font-weight:700;letter-spacing:.3px;font-size:16px;display:flex;align-items:center;gap:9px}
header.top .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
header.top .spacer{flex:1}
header.top a.navlink{color:var(--dim);font-size:14px;padding:6px 10px;border-radius:8px}
header.top a.navlink:hover{color:var(--txt);background:var(--panel2)}
main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
input,select,button{font:inherit}
.field{background:var(--panel);border:1px solid var(--line);color:var(--txt);
  padding:10px 13px;border-radius:10px;outline:none}
.field:focus{border-color:var(--accent)}
button.btn{background:var(--accent);color:#04121d;border:none;padding:10px 16px;
  border-radius:10px;font-weight:600;cursor:pointer}
button.btn:hover{filter:brightness(1.08)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.grid{display:grid;gap:14px}
.devgrid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.appgrid{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;transition:.15s;display:block}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.dev .nm{font-weight:600}
.dev .pn{color:var(--dim);font-size:12px;margin-top:3px;font-family:ui-monospace,monospace}
.appcard{display:flex;flex-direction:column;gap:10px}
.appcard .row{display:flex;gap:12px;align-items:center}
.appcard img.icon{width:56px;height:56px;border-radius:14px;background:var(--panel2);object-fit:cover;flex:none}
.appcard .nm{font-weight:600;line-height:1.25}
.appcard .dev2{color:var(--dim);font-size:12px;margin-top:2px}
.meta{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12.5px;margin-top:auto}
.stars{color:var(--gold);letter-spacing:1px}
.price{margin-left:auto;color:var(--ok);font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 20px}
.tab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);color:var(--dim);background:var(--panel);font-size:14px}
.tab.on{background:var(--accent);color:#04121d;border-color:var(--accent);font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar form{display:flex;gap:8px}
.pager{display:flex;gap:10px;justify-content:center;margin-top:28px}
.trending{color:var(--gold);font-size:12px}
.empty{color:var(--dim);text-align:center;padding:60px 0}
.backlink{color:var(--dim);font-size:14px;margin-bottom:14px;display:inline-block}
.backlink:hover{color:var(--txt)}
</style>
</head>
<body>
<header class="top">
  <a href="/" class="brand"><span class="dot"></span> OpenIQ</a>
  <span class="spacer"></span>
  {{if .LoggedIn}}<a href="/" class="navlink">Devices</a>{{if not .AutoLogin}}<a href="/logout" class="navlink">Log out</a>{{end}}{{end}}
</header>
<main>
{{end}}
